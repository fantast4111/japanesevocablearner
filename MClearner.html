<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文聽力填空測驗 & 寶可夢獎勵卡收集</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 24px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--primary-color);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #64748b;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }

    /* 題庫載入面板 */
    .control-panel {
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* 測驗區域 */
    .quiz-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .progress-bar {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .question-box {
      font-size: 1.25rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .hidden-text {
      color: #94a3b8;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .hidden-text.revealed {
      color: var(--text-color);
      background: #e0e7ff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background: #eef2ff;
    }

    .option-btn.correct {
      background-color: #d1fae5 !important;
      border-color: var(--success-color) !important;
      color: #065f46;
    }

    .option-btn.incorrect {
      background-color: #fee2e2 !important;
      border-color: var(--error-color) !important;
      color: #991b1b;
    }

    .feedback-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary-color);
      padding: 12px;
      margin-top: 16px;
      border-radius: 0 8px 8px 0;
      display: none;
    }

    /* Modal 通用樣式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    /* 放大圖片 3/4 高度視窗 */
    .zoom-modal-content {
      background: rgba(0,0,0,0.9);
      padding: 10px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .zoom-modal-content img {
      max-height: 75vh;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* 收藏藝廊格線 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 16px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 4px;
    }

    .gallery-item {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .gallery-item img {
      width: 100%;
      height: 80px;
      object-fit: contain;
      cursor: pointer;
      border-radius: 4px;
    }
    .gallery-item.locked {
      opacity: 0.4;
      filter: grayscale(100%);
    }

    /* 抽卡結果圖片 */
    #gacha-result-image {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      margin: 16px 0;
      cursor: pointer;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎧 日文聽力填空測驗</h1>
    <div class="toolbar">
      <span id="gacha-tickets-badge" style="font-weight:bold; color:#d97706; background:#fef3c7; padding:4px 10px; border-radius:20px;">抽卡機會: 0 🎴</span>
      <button onclick="openGalleryModal()" class="btn-secondary">🖼️ 收藏藝廊</button>
      <button onclick="openGachaModal()" id="header-gacha-btn" style="display:none;">抽卡 🎴</button>
    </div>
  </header>

  <!-- 題庫控制與載入面板 -->
  <div class="control-panel">
    <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="handleJsonUpload(event)">
    <button onclick="document.getElementById('json-file-input').click()">📁 上傳 JSON 題庫</button>

    <div style="display: flex; align-items: center; gap: 6px;">
      <span>L</span>
      <input type="number" id="lesson-num-input" value="34" min="1" max="99" style="width: 50px; padding: 4px; text-align: center; font-weight: bold;">
      <button onclick="loadLessonJsonFromFolder()">📥 讀取 Lxx.json</button>
    </div>

    <input type="file" id="csv-file-input" accept=".csv" style="display:none" onchange="handleCsvUpload(event)">
    <button onclick="document.getElementById('csv-file-input').click()" class="btn-secondary">📊 匯入獎勵卡 CSV (D欄)</button>
    <button onclick="loadDefaultCsvCards()" class="btn-secondary">⚡ 載入預設寶可夢卡池</button>
  </div>

  <!-- 測驗進行主畫面 -->
  <div id="quiz-area">
    <div class="quiz-card">
      <div class="progress-bar">
        <span id="progress-text">題目 1 / 20</span>
        <span id="score-text">得分: 0</span>
      </div>
      
      <div class="question-box">
        <span id="question-text" class="hidden-text" onclick="toggleQuestionText()">點擊此處顯示題目文字 (音訊播放中)</span>
      </div>

      <div class="options-grid" id="options-container">
        <!-- 選項動態生成 -->
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
        <button onclick="playCurrentQuestionAudio()" class="btn-secondary">🔊 重播語音</button>
        <button id="next-btn" onclick="nextQuestion()" style="display:none;">下一題 ➡️</button>
      </div>

      <div id="feedback-box" class="feedback-box">
        <div id="feedback-result" style="font-weight: bold; margin-bottom: 4px;"></div>
        <div id="feedback-translation" style="margin-bottom: 4px;"></div>
        <div id="feedback-explanation" style="font-size: 0.9rem; color: #475569;"></div>
      </div>
    </div>
  </div>

  <!-- 測驗結束結算畫面 -->
  <div id="result-area" style="display:none; text-align: center; padding: 40px 20px;">
    <h2>🎉 測驗完成！</h2>
    <p id="final-score-text" style="font-size: 1.2rem; margin: 20px 0;"></p>
    <div id="reward-notice" style="font-weight: bold; color: #d97706; margin-bottom: 20px;"></div>
    <button onclick="restartQuiz()">🔄 重新測驗</button>
  </div>
</div>

<!-- 抽卡 Modal -->
<div id="gacha-modal" class="modal">
  <div class="modal-content">
    <h2>🎴 寶可夢/獎勵卡抽卡</h2>
    <p id="gacha-prize-info">剩餘抽卡次數: <span id="modal-tickets-count">0</span></p>
    
    <img id="gacha-result-image" alt="獎勵卡圖片" title="點擊放大圖片">
    
    <div id="gacha-actions" style="margin-top: 16px; display: flex; gap: 10px; justify-content: center;">
      <button id="draw-one-btn" onclick="executeGachaDraw()">抽一張！</button>
      <button onclick="closeGachaModal()" class="btn-secondary">關閉</button>
    </div>
  </div>
</div>

<!-- 收藏藝廊 Modal -->
<div id="gallery-modal" class="modal">
  <div class="modal-content" style="max-width: 600px;">
    <h2>🖼️ 獎勵卡收藏藝廊</h2>
    <p style="font-size: 0.9rem; color: #64748b;">點擊已解鎖的卡片圖片可以放大觀看</p>
    <div class="gallery-grid" id="gallery-grid-container">
      <!-- 藝廊卡片動態載入 -->
    </div>
    <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
      <span id="gallery-stats" style="font-weight: bold;">已收集: 0 / 0</span>
      <div style="display: flex; gap: 8px;">
        <button onclick="openGachaModal()" id="gallery-draw-btn" style="display:none;">抽卡 🎴</button>
        <button onclick="closeGalleryModal()" class="btn-secondary">關閉</button>
      </div>
    </div>
  </div>
</div>

<!-- 圖片放大 Zoom Modal -->
<div id="zoom-modal" class="modal" onclick="closeZoomModal()">
  <div class="zoom-modal-content" onclick="event.stopPropagation()">
    <img id="zoomed-image-elem" src="" alt="放大卡片">
  </div>
</div>

<script>
  // 預設寶可夢卡池 (作為預設或未載入CSV時的備用)
  let defaultPokemonCards = [
    { id: 1, name: "皮卡丘", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" },
    { id: 2, name: "妙蛙種子", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" },
    { id: 3, name: "小火龍", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" },
    { id: 4, name: "傑尼龜", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" },
    { id: 5, name: "卡比獸", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png" },
    { id: 6, name: "伊布", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" },
    { id: 7, name: "胖丁", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png" },
    { id: 8, name: "超夢", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" }
  ];

  let rewardCardPool = [...defaultPokemonCards];
  let userInventory = JSON.parse(localStorage.getItem('user_inventory') || '[]');
  let gachaTickets = parseInt(localStorage.getItem('gacha_tickets') || '0');

  let quizData = [];
  let currentIdx = 0;
  let score = 0;
  let isAnswered = false;

  // 初始化載入預設寶可夢
  window.onload = function() {
    updateTicketsDisplay();
    // 預設載入示範題目以便直接測驗
    loadDefaultQuiz();
  };

  function loadDefaultQuiz() {
    quizData = [
      {
        question: "毎朝起きてから、必ず歯を（   ）。",
        options: ["みがきます", "みがいた", "みがいて", "みがかない"],
        answer: "みがきます",
        translation: "每天早上起床後，一定會刷牙。",
        explanation: "表示每天的習慣性動作，應使用現在／未來肯定形「みがきます」。"
      },
      {
        question: "料理を作る前に、石鹸でよく手を（   ）。",
        options: ["洗います", "洗いました", "洗って", "洗わない"],
        answer: "洗います",
        translation: "做菜之前，會用肥皂仔細洗手。",
        explanation: "「～前に」前接動詞辞書形，主句表示一般習慣或現在動作，使用「洗います」。"
      }
    ];
    initQuiz();
  }

  function initQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById('result-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const q = quizData[currentIdx];
    document.getElementById('progress-text').innerText = `題目 ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById('score-text').innerText = `得分: ${score}`;
    
    const qTextElem = document.getElementById('question-text');
    qTextElem.innerText = "點擊此處顯示題目文字 (音訊播放中)";
    qTextElem.classList.remove('revealed');

    // 隨機排列 4 個選項
    let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    shuffledOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => selectAnswer(opt, btn);
      container.appendChild(btn);
    });

    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    playCurrentQuestionAudio();
  }

  function toggleQuestionText() {
    const qTextElem = document.getElementById('question-text');
    qTextElem.innerText = quizData[currentIdx].question;
    qTextElem.classList.add('revealed');
  }

  function playCurrentQuestionAudio() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    
    const textToSpeak = quizData[currentIdx].question.replace(/（   ）/g, "……空白……");
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  function selectAnswer(selectedOpt, btnElem) {
    if (isAnswered) return;
    isAnswered = true;

    const q = quizData[currentIdx];
    const isCorrect = (selectedOpt === q.answer);
    
    if (isCorrect) {
      score++;
      btnElem.classList.add('correct');
    } else {
      btnElem.classList.add('incorrect');
      // 標出正確答案
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => {
        if (b.innerText === q.answer) b.classList.add('correct');
      });
    }

    // 顯示解析
    document.getElementById('feedback-result').innerText = isCorrect ? "✅ 答對了！" : "❌ 答錯了！";
    document.getElementById('feedback-result').style.color = isCorrect ? "var(--success-color)" : "var(--error-color)";
    document.getElementById('feedback-translation').innerText = "翻譯：" + q.translation;
    document.getElementById('feedback-explanation').innerText = "解析：" + q.explanation;
    document.getElementById('feedback-box').style.display = 'block';

    document.getElementById('next-btn').style.display = 'inline-block';
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    
    const accuracy = (score / quizData.length) * 100;
    document.getElementById('final-score-text').innerText = `您的得分: ${score} / ${quizData.length} (${accuracy.toFixed(1)}%)`;

    // 根據準確率給予抽獎機會：100%=+3, 80-99%=+2, 50-79%=+1
    let addedTickets = 0;
    if (accuracy === 100) {
      addedTickets = 3;
    } else if (accuracy >= 80) {
      addedTickets = 2;
    } else if (accuracy >= 50) {
      addedTickets = 1;
    }

    if (addedTickets > 0) {
      gachaTickets += addedTickets;
      saveTickets();
      document.getElementById('reward-notice').innerText = `🎁 恭喜達成門檻！獲得額外 ${addedTickets} 次抽卡機會！`;
    } else {
      document.getElementById('reward-notice').innerText = `💪 再接再厲，得分達到 50% 以上即可獲得抽卡機會！`;
    }
    updateTicketsDisplay();
  }

  function restartQuiz() {
    initQuiz();
  }

  // === 讀取 Lxx.json 檔案 ===
  async function loadLessonJsonFromFolder() {
    const num = document.getElementById('lesson-num-input').value.trim();
    if (!num) {
      alert("請輸入有效的課程數字！");
      return;
    }
    const filePath = `json/L${num}.json`;
    try {
      const response = await fetch(filePath);
      if (!response.ok) throw new Error(`找不到檔案：${filePath}`);
      const data = await response.json();
      quizData = data;
      initQuiz();
      alert(`成功載入 ${filePath}！`);
    } catch (error) {
      console.error(error);
      alert(`讀取失敗：無法載入 ${filePath}\n請確認 json 資料夾中是否有此檔案，或透過上傳按鈕上傳。`);
    }
  }

  // === 處理 JSON 上傳 ===
  function handleJsonUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data) && data.length > 0) {
          quizData = data;
          initQuiz();
          alert("成功匯入 JSON 題庫！");
        } else {
          alert("JSON 格式不正確或內容為空。");
        }
      } catch (err) {
        alert("解析 JSON 失敗：" + err.message);
      }
    };
    reader.readAsText(file);
  }

  // === 處理 CSV 獎勵卡（讀取 D 欄 / 第 4 欄圖片） ===
  function handleCsvUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      parseCsvData(e.target.result);
    };
    reader.readAsText(file);
  }

  function loadDefaultCsvCards() {
    rewardCardPool = [...defaultPokemonCards];
    alert("已載入預設寶可夢卡片庫（共 8 張）！");
  }

  function parseCsvData(text) {
    const lines = text.split(/\r\n|\n/);
    let newCards = [];
    let idCounter = 1;

    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      // 簡單 CSV 解析（支援引號包覆）
      const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      if (cols.length >= 4) {
        let name = cols[1] ? cols[1].replace(/["']/g, "").trim() : `獎勵卡 ${idCounter}`;
        let imgUrl = cols[3] ? cols[3].replace(/["']/g, "").trim() : "";
        
        if (imgUrl && imgUrl.startsWith('http')) {
          newCards.push({
            id: idCounter++,
            name: name || `獎勵卡 ${idCounter}`,
            image: imgUrl
          });
        }
      }
    }

    if (newCards.length > 0) {
      rewardCardPool = newCards;
      alert(`成功從 CSV 第 4 欄 (D欄) 讀取 ${newCards.length} 張獎勵卡！`);
    } else {
      alert("未能從 CSV 中解析出有效的 D 欄圖片網址，請確認格式。");
    }
  }

  // === 抽卡與收藏庫系統 ===
  function updateTicketsDisplay() {
    document.getElementById('gacha-tickets-badge').innerText = `抽卡機會: ${gachaTickets} 🎴`;
    document.getElementById('modal-tickets-count').innerText = gachaTickets;
    
    const headerBtn = document.getElementById('header-gacha-btn');
    const galleryDrawBtn = document.getElementById('gallery-draw-btn');
    if (gachaTickets > 0) {
      headerBtn.style.display = 'inline-block';
      galleryDrawBtn.style.display = 'inline-block';
    } else {
      headerBtn.style.display = 'none';
      galleryDrawBtn.style.display = 'none';
    }
    localStorage.setItem('gacha_tickets', gachaTickets);
  }

  function openGachaModal() {
    document.getElementById('gacha-modal').style.display = 'flex';
    // 抽卡前清空/隱藏上一次抽中的圖片，視窗維持標準大小
    const imgElem = document.getElementById('gacha-result-image');
    imgElem.src = "";
    imgElem.style.display = 'none';
    document.getElementById('gacha-prize-info').innerText = `剩餘抽卡次數: ${gachaTickets}`;
    document.getElementById('draw-one-btn').disabled = (gachaTickets <= 0);
  }

  function closeGachaModal() {
    document.getElementById('gacha-modal').style.display = 'none';
    updateTicketsDisplay();
  }

  function executeGachaDraw() {
    if (gachaTickets <= 0) return;

    // 計算尚未擁有的卡片（防重複機制）
    let availableCards = rewardCardPool.filter(card => !userInventory.includes(card.id));
    
    if (availableCards.length === 0) {
      alert("恭喜你！已經收集完全部卡片了！");
      return;
    }

    gachaTickets--;
    updateTicketsDisplay();

    // 隨機抽一張
    let randomIndex = Math.floor(Math.random() * availableCards.length);
    let wonCard = availableCards[randomIndex];

    // 加入收藏庫
    userInventory.push(wonCard.id);
    localStorage.setItem('user_inventory', JSON.stringify(userInventory));

    // 顯示抽中結果（抽完後顯示圖片，點擊可放大）
    const imgElem = document.getElementById('gacha-result-image');
    imgElem.src = wonCard.image;
    imgElem.style.display = 'block';
    imgElem.onclick = () => showZoomedModal(wonCard.image);

    document.getElementById('gacha-prize-info').innerText = `🎉 恭喜抽中：${wonCard.name}！`;
    document.getElementById('draw-one-btn').disabled = (gachaTickets <= 0);
  }

  function openGalleryModal() {
    const container = document.getElementById('gallery-grid-container');
    container.innerHTML = '';

    let collectedCount = 0;
    rewardCardPool.forEach(card => {
      let isUnlocked = userInventory.includes(card.id);
      if (isUnlocked) collectedCount++;

      const item = document.createElement('div');
      item.className = `gallery-item ${isUnlocked ? '' : 'locked'}`;
      
      if (isUnlocked) {
        item.innerHTML = `
          <img src="${card.image}" alt="${card.name}" onclick="showZoomedModal('${card.image}')" title="點擊放大">
          <div style="font-size:0.75rem; margin-top:4px; font-weight:bold;">${card.name}</div>
        `;
      } else {
        item.innerHTML = `
          <div style="height:80px; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:1.5rem;">🔒</div>
          <div style="font-size:0.75rem; margin-top:4px; color:#94a3b8;">未解鎖</div>
        `;
      }
      container.appendChild(item);
    });

    document.getElementById('gallery-stats').innerText = `已收集: ${collectedCount} / ${rewardCardPool.length}`;
    document.getElementById('gallery-modal').style.display = 'flex';
  }

  function closeGalleryModal() {
    document.getElementById('gallery-modal').style.display = 'none';
  }

  function showZoomedModal(imgSrc) {
    document.getElementById('zoomed-image-elem').src = imgSrc;
    document.getElementById('zoom-modal').style.display = 'flex';
  }

  function closeZoomModal() {
    document.getElementById('zoom-modal').style.display = 'none';
  }
</script>

</body>
</html>
